name: Windows source generators

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Check native x64 host and synthetic input guards
        shell: pwsh
        run: |
          python -c "import platform; print(platform.platform()); assert platform.machine().lower() in ('amd64', 'x86_64')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_module_build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_source_patches.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build pinned generators and execute synthetic code
        run: python scripts/check-host-generators.py --jobs 4
